<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Muhammad Faizan — AI Solutions Architect & Full-Stack Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D13; --violet:#0E8FD6; --cyan:#3FB6EC; --amber:#F4A94A;
    --ink:#1B1E27; --muted:#6B7180; --line:#E7E6E2; --paper:#FBFAF8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(139,124,255,0.12), transparent 60%),
      var(--bg);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif; color:var(--ink);
    padding:40px 16px;
    overflow-x:hidden;
  }
  .brand{
    font-family:'JetBrains Mono',monospace; color:var(--cyan); font-size:12px;
    letter-spacing:3px; margin-bottom:6px; text-transform:uppercase; opacity:0.8;
  }
  .stage-title{
    font-family:'Space Grotesk',sans-serif; color:#fff; font-size:clamp(20px,3vw,28px);
    font-weight:600; margin-bottom:34px; text-align:center;
  }

  .stage{ perspective:2400px; }
  .book{
    position:relative;
    width:min(880px, 92vw);
    height:min(560px, 78vw);
    display:flex;
  }

  /* COVER */
  .cover{
    width:100%; height:100%; border-radius:10px; overflow:hidden;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(139,124,255,0.35), transparent 55%),
      linear-gradient(150deg, #12141c, #0A0B10 70%);
    border:1px solid #23283a;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px;
    box-shadow:0 40px 90px -30px rgba(0,0,0,0.7);
  }
  .cover .eyebrow{
    font-family:'JetBrains Mono',monospace; color:var(--amber); font-size:12px;
    letter-spacing:3px; margin-bottom:18px;
  }
  .cover h1{
    font-family:'Space Grotesk',sans-serif; color:#fff; font-size:clamp(30px,5vw,46px);
    font-weight:700; margin-bottom:10px;
  }
  .cover .role{ color:#AEB4C4; font-size:16px; margin-bottom:20px; }
  .cover .tag{ color:#8890A2; font-size:14px; max-width:420px; line-height:1.7; margin-bottom:32px; }
  .cover .cbtns{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }

  /* SPREAD */
  .spread{
    width:100%; height:100%;
    border-radius:10px; overflow:hidden;
    background:var(--paper);
    display:flex;
    box-shadow:0 40px 90px -30px rgba(0,0,0,0.7);
    transform-style:preserve-3d;
    transform-origin:center center;
  }
  .page{
    width:50%; height:100%;
    position:relative; display:flex; flex-direction:column;
  }
  .page.left{ border-right:1px solid var(--line); }
  .page-scroll{
    flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
    padding:32px 28px 14px;
    scrollbar-width:thin; scrollbar-color:#D8D6D0 transparent;
  }
  .page-scroll::-webkit-scrollbar{ width:5px; }
  .page-scroll::-webkit-scrollbar-thumb{ background:#D8D6D0; border-radius:3px; }
  .page-num{
    flex:0 0 auto; padding:8px 28px 16px;
    text-align:center;
    font-family:'JetBrains Mono',monospace; font-size:11px; color:#B7B4AC;
  }
  .page.left .page-num{ text-align:left; }
  .page.right .page-num{ text-align:right; }

  h2.page-title{
    font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600;
    margin-bottom:20px; color:var(--ink);
  }

  /* profile page */
  .avatar{
    width:84px; height:84px; border-radius:50%; margin:0 auto 14px;
    background:linear-gradient(135deg, var(--violet), var(--cyan));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Space Grotesk'; font-weight:700; font-size:26px;
    overflow:hidden;
    box-shadow:0 0 0 3px #fff, 0 4px 16px rgba(14,143,214,0.35);
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .cover-avatar{
    width:100px; height:100px; border-radius:50%; margin:0 auto 18px;
    overflow:hidden; box-shadow:0 0 0 3px rgba(255,255,255,0.15), 0 10px 30px rgba(0,0,0,0.5);
  }
  .cover-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* resume page */
  .resume-block{ margin-bottom:14px; }
  .resume-h{ font-family:'JetBrains Mono'; font-size:10.5px; color:var(--violet); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
  .resume-p{ font-size:11.5px; color:var(--muted); line-height:1.6; }
  .resume-li{ font-size:11.2px; color:var(--muted); line-height:1.6; margin-bottom:3px; padding-left:12px; position:relative; }
  .resume-li::before{ content:'—'; position:absolute; left:0; color:var(--violet); }
  .profile-name{ text-align:center; font-family:'Space Grotesk'; font-size:19px; font-weight:700; }
  .profile-role{ text-align:center; color:var(--violet); font-size:12.5px; font-weight:600; margin-top:2px; margin-bottom:14px; }
  .socials{ display:flex; justify-content:center; gap:10px; margin-bottom:16px; }
  .social{
    width:32px; height:32px; border-radius:50%; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; text-decoration:none;
    font-size:13px; font-family:'JetBrains Mono';
  }
  .profile-bio{ font-size:12.5px; color:var(--muted); text-align:center; line-height:1.7; margin-bottom:18px; }
  .profile-loc{ text-align:center; font-size:11.5px; color:#9a9690; margin-bottom:18px; font-family:'JetBrains Mono'; }
  .pbtns{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }

  .btn{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:500;
    padding:10px 18px; border-radius:6px; text-decoration:none; border:1px solid transparent;
    display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  }
  .btn-solid{ background:var(--ink); color:#fff; }
  .btn-outline{ border-color:var(--ink); color:var(--ink); background:transparent; }
  .cover .btn-solid{ background:linear-gradient(100deg,var(--violet),var(--cyan)); color:#0A0B10; font-weight:700; border:none; }
  .cover .btn-outline{ border-color:#3A4054; color:#fff; }

  /* timeline */
  .tl-item{ display:flex; gap:12px; margin-bottom:18px; }
  .tl-dot{
    width:30px; height:30px; border-radius:8px; background:#EEF0FE; color:var(--violet);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:13px;
  }
  .tl-year{ font-family:'JetBrains Mono'; font-size:10.5px; color:var(--violet); font-weight:600; letter-spacing:0.5px; }
  .tl-role{ font-size:13.5px; font-weight:700; margin:2px 0 4px; }
  .tl-desc{ font-size:11.8px; color:var(--muted); line-height:1.6; }

  /* services / skills grid */
  .svc-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .svc-card{ border:1px solid var(--line); border-radius:8px; padding:14px; }
  .svc-icon{ width:26px; height:26px; border-radius:6px; background:#EEF0FE; color:var(--violet); display:flex; align-items:center; justify-content:center; font-size:12px; margin-bottom:8px; }
  .svc-title{ font-size:12.5px; font-weight:700; margin-bottom:4px; }
  .svc-desc{ font-size:10.8px; color:var(--muted); line-height:1.5; }

  .skill-block{ margin-bottom:16px; }
  .skill-cat{ font-family:'JetBrains Mono'; font-size:10.5px; color:var(--violet); letter-spacing:1px; margin-bottom:8px; text-transform:uppercase; }
  .skill-pills{ display:flex; flex-wrap:wrap; gap:6px; }
  .pill{ font-size:10.8px; border:1px solid var(--line); border-radius:14px; padding:4px 10px; color:var(--ink); background:#F5F4F1; }

  /* project page */
  .proj-tag{ display:inline-block; font-family:'JetBrains Mono'; font-size:10px; color:#fff; background:var(--ink); padding:4px 10px; border-radius:4px; margin-bottom:12px; }
  .proj-title{ font-family:'Space Grotesk'; font-size:18px; font-weight:700; margin-bottom:10px; }
  .proj-desc{ font-size:12px; color:var(--muted); line-height:1.7; margin-bottom:12px; }
  .proj-stack{ display:flex; flex-wrap:wrap; gap:6px; }

  .plist-item{ display:flex; gap:10px; align-items:flex-start; margin-bottom:16px; }
  .plist-dot{ width:7px; height:7px; border-radius:50%; background:var(--cyan); margin-top:6px; flex-shrink:0; }
  .plist-title{ font-size:13px; font-weight:700; }
  .plist-desc{ font-size:11.5px; color:var(--muted); line-height:1.5; }

  /* contact page */
  .contact-field{ margin-bottom:14px; }
  .contact-label{ font-family:'JetBrains Mono'; font-size:10px; color:var(--violet); letter-spacing:1px; text-transform:uppercase; margin-bottom:3px; }
  .contact-value{ font-size:13px; font-weight:600; }
  .otw-wrap{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .otw-star{ width:54px; height:54px; border-radius:50%; border:2px solid var(--violet); color:var(--violet); display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:16px; }

  /* CONTROLS */
  .controls{
    display:flex; align-items:center; gap:18px; margin-top:26px;
  }
  .nav-btn{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:#cfd2dc;
    background:#161A24; border:1px solid #2A2F3D; padding:9px 16px; border-radius:20px;
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .nav-btn:disabled{ opacity:0.3; cursor:default; }
  .dots{ display:flex; gap:7px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:#3A3F4E; cursor:pointer; transition:all 0.25s; }
  .dot.active{ background:linear-gradient(100deg,var(--violet),var(--cyan)); width:20px; border-radius:4px; }

  @media (max-width:640px){
    .svc-grid{ grid-template-columns:1fr; }
  }

  @media (max-width:760px){
    .stage{ perspective:none; }
    .book{
      width:94vw; height:min(78vh, 680px);
    }
    .cover{ overflow-y:auto; }
    .spread{
      flex-direction:column;
      overflow-y:auto; overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
    }
    .page{
      width:100%; height:auto; flex:none;
    }
    .page.left{ border-right:none; border-bottom:1px solid var(--line); }
    .page-scroll{
      flex:none; overflow:visible; padding:22px 20px 6px;
    }
    .page-num{ padding:4px 20px 16px; }
  }
</style>
</head>

  `,
  open: `

      <div class="otw-star">★</div>
      <div class="proj-title">Open to Work</div>
      <div class="proj-desc" style="max-width:260px;">Looking for AI agent development, automation, or full-stack builds? Let's build something intelligent together.</div>
      <a class="btn btn-solid" href="mailto:adreesfaizan428@gmail.com">Say Hello</a>

let current = 0;
const book = document.getElementById('book');
const dotsEl = document.getElementById('dots');
const stageTitle = document.getElementById('stageTitle');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function buildCover(){
  return `
    <div class="cover">
      <div class="cover-avatar"><img src="${PHOTO}" alt="Muhammad Faizan"/></div>
      <div class="eyebrow">PORTFOLIO 2026</div>
      <h1>Muhammad Faizan</h1>
      <div class="role">AI Solutions Architect & Full-Stack Developer</div>
      <div class="tag">Turning complex ideas — and AI agents — into sharp, reliable software that ships and scales.</div>
      <div class="cbtns">
        <button class="btn btn-solid" onclick="goTo(4)">View Projects</button>
        <button class="btn btn-outline" onclick="goTo(5)">Contact Me</button>
      </div>
    </div>
  `;
}

function buildSpread(p){
  return `
    <div class="spread" id="spreadEl">
      <div class="page left"><div class="page-scroll">${templates[p.left]}</div><div class="page-num">${(current)*2-1 > 0 ? (current)*2-1 : ''}</div></div>
      <div class="page right"><div class="page-scroll">${templates[p.right]}</div><div class="page-num">${(current)*2}</div></div>
    </div>
  `;
}

function render(){
  const p = pages[current];
  book.innerHTML = p.type === 'cover' ? buildCover() : buildSpread(p);
  stageTitle.textContent = p.type === 'cover' ? 'Cover' : p.title;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === pages.length - 1;
  dotsEl.innerHTML = pages.map((_,i)=>`<div class="dot ${i===current?'active':''}" onclick="goTo(${i})"></div>`).join('');
}

function flipTo(newIndex){
  if(newIndex < 0 || newIndex >= pages.length || newIndex === current) return;
  const dir = newIndex > current ? 1 : -1;
  book.style.transition = 'transform 0.32s ease-in, opacity 0.32s ease-in';
  book.style.transform = `rotateY(${dir*-14}deg) scale(0.94)`;
  book.style.opacity = '0.4';
  setTimeout(()=>{
    current = newIndex;
    render();
    book.style.transition = 'none';
    book.style.transform = `rotateY(${dir*14}deg) scale(0.94)`;
    book.style.opacity = '0.4';
    void book.offsetWidth;
    book.style.transition = 'transform 0.32s ease-out, opacity 0.32s ease-out';
    book.style.transform = 'rotateY(0deg) scale(1)';
    book.style.opacity = '1';
  }, 320);
}

function goTo(i){ flipTo(i); }
prevBtn.addEventListener('click', ()=>flipTo(current-1));
nextBtn.addEventListener('click', ()=>flipTo(current+1));

render();
</script>
